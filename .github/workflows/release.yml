# On every push to main, build mp3-to-pdf.skill (+ an identical .zip) containing the mp3-to-pdf/
# folder with SKILL.md, and publish them as a release. Permanent download links:
#   https://github.com/<username>/mp3-to-pdf/releases/latest/download/mp3-to-pdf.skill
#   https://github.com/<username>/mp3-to-pdf/releases/latest/download/mp3-to-pdf.zip
name: Release ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mp3-to-pdf.skill and .zip
        run: |
          mkdir -p dist/mp3-to-pdf
          rsync -a --exclude '.git' --exclude '.github' --exclude '.gitignore' \
                   --exclude 'dist' --exclude 'vendor' --exclude '__pycache__' ./ dist/mp3-to-pdf/
          test -f dist/mp3-to-pdf/SKILL.md
          cd dist && zip -qr mp3-to-pdf.zip mp3-to-pdf && cp mp3-to-pdf.zip mp3-to-pdf.skill && unzip -l mp3-to-pdf.skill

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          gh release create "$TAG" dist/mp3-to-pdf.skill dist/mp3-to-pdf.zip \
            --title "mp3-to-pdf $TAG" \
            --notes "Download **mp3-to-pdf.skill** and add it to Claude: Settings → Skills → Upload skill. If your app does not accept .skill, use the identical **mp3-to-pdf.zip**. Full instructions in the README." \
            --latest
